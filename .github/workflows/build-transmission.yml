name: Build Transmission Docker Image

on:
  workflow_dispatch:
    inputs:
      version-folder:
        description: 'Transmission version folder to build'
        required: true
        default: '4.0.5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Log in to GHCR
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 4. Determine next build number
    - name: Determine next build number
      id: next_build
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        REPO="${{ github.repository }}"
        # Get all existing tags for this version
        EXISTING_TAGS=$(gh api "repos/$REPO/packages/container/transmission/versions" --jq '.[].metadata.container.tags[]?' || echo "")
        # Filter tags that match the version
        BUILD_NUM=0
        for TAG in $EXISTING_TAGS; do
          if [[ "$TAG" =~ ^$VERSION-build([0-9]+)$ ]]; then
            NUM="${BASH_REMATCH[1]}"
            if (( NUM > BUILD_NUM )); then
              BUILD_NUM=$NUM
            fi
          fi
        done
        # Next build number
        BUILD_NUM=$((BUILD_NUM + 1))
        echo "Next build number: $BUILD_NUM"
        echo "build-number=$BUILD_NUM" >> $GITHUB_OUTPUT

    # 5. Build Docker image
    - name: Build Docker image
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        BUILD_NUM=${{ steps.next_build.outputs.build-number }}
        IMAGE_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-build${BUILD_NUM}"
        COMMIT_SHA=$(git rev-parse --short HEAD)
        echo "Building image $IMAGE_TAG from commit $COMMIT_SHA"
        docker build \
          --label "git-commit=${COMMIT_SHA}" \
          -t "$IMAGE_TAG" \
          ./$VERSION

    # 6. Push Docker image
    - name: Push Docker image to GHCR
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        BUILD_NUM=${{ steps.next_build.outputs.build-number }}
        IMAGE_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-build${BUILD_NUM}"
        docker push "$IMAGE_TAG"
