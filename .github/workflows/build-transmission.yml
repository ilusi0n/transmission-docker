name: Build Transmission Docker Image

on:
  workflow_dispatch:
    inputs:
      version-folder:
        description: "Folder containing the Transmission version (e.g., 4.0.5)"
        required: true
        default: "4.0.5"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/transmission

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set commit SHA
    - name: Set short commit SHA
      id: vars
      run: |
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 3. Build Docker image
    - name: Build Docker image
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        docker build -f "${VERSION}/Dockerfile" -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}-release-${SHA}" .

    # 4. Tag latest
    - name: Tag latest image
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        docker tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}-release-${SHA}" "${REGISTRY}/${IMAGE_NAME}:${VERSION}-latest"

    # 5. Log in to GitHub Container Registry
    - name: Log in to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 6. Push images to GHCR
    - name: Push images
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        docker push "${REGISTRY}/${IMAGE_NAME}:${VERSION}-release-${SHA}"
        docker push "${REGISTRY}/${IMAGE_NAME}:${VERSION}-latest"

    # 7. Create Git tag
    - name: Create Git tag
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag -f "${VERSION}-release-${SHA}"
        git push origin "${VERSION}-release-${SHA}" -f

    # 8. Generate changelog (commits since last release)
    - name: Generate changelog
      id: changelog
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        CURRENT_TAG="${VERSION}-release-${SHA}"

        # Find previous tag for this version
        PREVIOUS_TAG=$(git tag --list "${VERSION}-release-*" --sort=-creatordate | grep -v "$CURRENT_TAG" | head -n 1)

        echo "Previous tag: $PREVIOUS_TAG"

        if [ -z "$PREVIOUS_TAG" ]; then
          echo "log=Initial release of ${VERSION}" >> $GITHUB_OUTPUT
        else
          LOG=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    # 9. Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version-folder }}-release-${{ steps.vars.outputs.sha }}
        name: Transmission ${{ github.event.inputs.version-folder }} (release ${{ steps.vars.outputs.sha }})
        body: |
          🚀 Transmission Docker Image Release

          Version: `${{ github.event.inputs.version-folder }}`
          Commit: `${{ steps.vars.outputs.sha }}`

          🔄 Changes since previous release:
          ${{ steps.changelog.outputs.log }}

          🐳 Container images:

          ghcr.io/${{ github.repository }}/transmission:${{ github.event.inputs.version-folder }}-release-${{ steps.vars.outputs.sha }}

          ghcr.io/${{ github.repository }}/transmission:${{ github.event.inputs.version-folder }}-latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
