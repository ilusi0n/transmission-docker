name: Build & Release Transmission Image

on:
  workflow_dispatch:
    inputs:
      version-folder:
        description: "Transmission version folder to build (e.g. 4.0.5)"
        required: true
        default: "4.0.5"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login to GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 4. Get short commit SHA
    - name: Get short commit SHA
      id: vars
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

    # 5. Build Docker image
    - name: Build Docker image
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"

        RELEASE_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-release-${SHA}"
        LATEST_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-latest"

        echo "Building:"
        echo "$RELEASE_TAG"
        echo "$LATEST_TAG"

        docker build \
          --label "git-commit=${SHA}" \
          -t "$RELEASE_TAG" \
          -t "$LATEST_TAG" \
          ./$VERSION

    # 6. Push images
    - name: Push images to GHCR
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"

        RELEASE_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-release-${SHA}"
        LATEST_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-latest"

        docker push "$RELEASE_TAG"
        docker push "$LATEST_TAG"

    # 7. Create Git tag
    - name: Create Git tag
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        TAG="${VERSION}-release-${SHA}"

        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git tag "$TAG"
        git push origin "$TAG"

    # 8. Generate structured changelog
    - name: Generate Changelog
      id: changelog
      run: |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "Last tag: $LAST_TAG"

        # Get commits since last tag
        if [ -n "$LAST_TAG" ]; then
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:'%s (%an)')
        else
          COMMITS=$(git log --pretty=format:'%s (%an)')
        fi

        # Initialize sections
        FEATURES=""
        FIXES=""
        OTHERS=""

        # Categorize commits
        while read -r line; do
          case "$line" in
            feat:*) FEATURES+="- ${line#feat:} \n" ;;
            fix:*) FIXES+="- ${line#fix:} \n" ;;
            *) OTHERS+="- $line \n" ;;
          esac
        done <<< "$COMMITS"

        # Build final changelog
        CHANGELOG=""

        if [ -n "$FEATURES" ]; then
          CHANGELOG+="**Features:**\n$FEATURES\n"
        fi
        if [ -n "$FIXES" ]; then
          CHANGELOG+="**Fixes:**\n$FIXES\n"
        fi
        if [ -n "$OTHERS" ]; then
          CHANGELOG+="**Others:**\n$OTHERS\n"
        fi

        # Fallback if empty
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="No changes since last release."
        fi

        echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

    # 9. Create GitHub Release with structured changelog
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version-folder }}-release-${{ steps.vars.outputs.sha }}
        name: Transmission ${{ github.event.inputs.version-folder }} (release ${{ steps.vars.outputs.sha }})
        body: |
          🚀 Transmission Docker Image Release

          Version folder: `${{ github.event.inputs.version-folder }}`
          Commit: `${{ steps.vars.outputs.sha }}`

          Container images:

          ghcr.io/${{ github.repository }}/transmission:${{ github.event.inputs.version-folder }}-release-${{ steps.vars.outputs.sha }}
          ghcr.io/${{ github.repository }}/transmission:${{ github.event.inputs.version-folder }}-latest

          ### Changelog
          ${{ steps.changelog.outputs.changelog }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 10. Done
    - name: Done
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"

        echo "Release created:"
        echo "${VERSION}-release-${SHA}"
