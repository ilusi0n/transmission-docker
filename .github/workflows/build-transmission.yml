name: Build & Publish Transmission Image

on:
  workflow_dispatch:
    inputs:
      version-folder:
        description: "Transmission version folder to build (e.g. 4.0.5)"
        required: true
        default: "4.0.5"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login to GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 4. Generate short commit hash
    - name: Get short commit SHA
      id: vars
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

    # 5. Build Docker image
    - name: Build Docker image
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-release-${SHA}"

        echo "Building $TAG"

        docker build \
          --label "git-commit=${SHA}" \
          -t "$TAG" \
          ./$VERSION

    # 6. Push image
    - name: Push image to GHCR
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-release-${SHA}"

        docker push "$TAG"

    # 7. Print result
    - name: Done
      run: |
        VERSION="${{ github.event.inputs.version-folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        echo "Image published:"
        echo "ghcr.io/${{ github.repository }}/transmission:${VERSION}-release-${SHA}"
