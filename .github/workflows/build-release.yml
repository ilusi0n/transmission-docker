name: Manual Build & Release Transmission Docker

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder to build (example: 4.0.5-ubuntu)"
        required: true
        type: string
      commit:
        description: "Commit SHA, branch or tag (optional)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo (default branch first)
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0   # important so we can checkout any commit

    # 2. Checkout specific commit if provided
    - name: Checkout selected commit
      if: ${{ github.event.inputs.commit != '' }}
      run: |
        git checkout ${{ github.event.inputs.commit }}

    # 3. Get short commit SHA (after checkout)
    - name: Get short commit SHA
      id: vars
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 4. Validate folder exists
    - name: Validate folder
      run: |
        FOLDER="${{ github.event.inputs.folder }}"
        if [ ! -d "$FOLDER" ]; then
          echo "❌ Folder '$FOLDER' does not exist."
          echo ""
          echo "Available folders:"
          ls -d */ | sed 's#/##'
          exit 1
        fi

    # 5. Set up Docker Buildx
    - uses: docker/setup-buildx-action@v3

    # 6. Login to GHCR
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 7. Prepare variables
    - name: Prepare image variables
      id: prep
      run: |
        FOLDER="${{ github.event.inputs.folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        IMAGE_BASE="ghcr.io/${{ github.repository }}/transmission"

        SHA_TAG="$IMAGE_BASE:${FOLDER}-${SHA}"
        LATEST_TAG="$IMAGE_BASE:${FOLDER}-latest"
        GIT_TAG="transmission-${FOLDER}-${SHA}"

        echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "git_tag=$GIT_TAG" >> $GITHUB_OUTPUT

    # 8. Build image
    - name: Build Docker images
      run: |
        docker build \
          --label "git-commit=${{ steps.vars.outputs.sha }}" \
          -t "${{ steps.prep.outputs.sha_tag }}" \
          -t "${{ steps.prep.outputs.latest_tag }}" \
          ./${{ github.event.inputs.folder }}

    # 9. Push images
    - name: Push images
      run: |
        docker push "${{ steps.prep.outputs.sha_tag }}"
        docker push "${{ steps.prep.outputs.latest_tag }}"

    # 10. Create Git tag
    - name: Create Git tag
      run: |
        git tag ${{ steps.prep.outputs.git_tag }}
        git push origin ${{ steps.prep.outputs.git_tag }}

    # 11. Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.prep.outputs.git_tag }}
        name: Transmission ${{ github.event.inputs.folder }}
        body: |
          🚀 Transmission Docker Image Release

          Folder built: `${{ github.event.inputs.folder }}`
          Commit built: `${{ steps.vars.outputs.sha }}`

          Docker images:

          - ${{ steps.prep.outputs.sha_tag }}
          - ${{ steps.prep.outputs.latest_tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
