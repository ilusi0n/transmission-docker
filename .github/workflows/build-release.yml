name: Manual Build & Release Transmission Docker

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Version to build"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Validate folder exists
    - name: Validate folder
      run: |
        if [ ! -d "${{ github.event.inputs.folder }}" ]; then
          echo "Folder '${{ github.event.inputs.folder }}' does not exist."
          exit 1
        fi

    # 3. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Login to GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 5. Get short commit SHA
    - name: Get short commit SHA
      id: vars
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 6. Prepare image variables
    - name: Prepare image variables
      id: prep
      run: |
        FOLDER="${{ github.event.inputs.folder }}"
        SHA="${{ steps.vars.outputs.sha }}"
        IMAGE_BASE="ghcr.io/${{ github.repository }}/transmission"

        SHA_TAG="$IMAGE_BASE:${FOLDER}-${SHA}"
        LATEST_TAG="$IMAGE_BASE:latest"
        GIT_TAG="transmission-${FOLDER}-${SHA}"

        echo "folder=$FOLDER" >> $GITHUB_OUTPUT
        echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "git_tag=$GIT_TAG" >> $GITHUB_OUTPUT

        echo "Building folder: $FOLDER"
        echo "SHA tag: $SHA_TAG"
        echo "Latest tag: $LATEST_TAG"

    # 7. Build Docker image
    - name: Build Docker images
      run: |
        docker build \
          --label "git-commit=${{ steps.vars.outputs.sha }}" \
          -t "${{ steps.prep.outputs.sha_tag }}" \
          -t "${{ steps.prep.outputs.latest_tag }}" \
          ./${{ steps.prep.outputs.folder }}

    # 8. Push images
    - name: Push images to GHCR
      run: |
        docker push "${{ steps.prep.outputs.sha_tag }}"
        docker push "${{ steps.prep.outputs.latest_tag }}"

    # 9. Create Git tag
    - name: Create Git tag
      run: |
        git tag ${{ steps.prep.outputs.git_tag }}
        git push origin ${{ steps.prep.outputs.git_tag }}

    # 10. Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.prep.outputs.git_tag }}
        name: Transmission ${{ github.event.inputs.folder }}
        body: |
          🚀 Transmission Docker Image Release

          Folder built: `${{ github.event.inputs.folder }}`
          Commit: `${{ steps.vars.outputs.sha }}`

          Docker images:

          - ${{ steps.prep.outputs.sha_tag }}
          - ${{ steps.prep.outputs.latest_tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
