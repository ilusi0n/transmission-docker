name: Build & Release Transmission Docker on Tag

on:
  push:
    tags:
    - '*' # triggers on all tags

permissions:
  contents: write # create/update GitHub releases
  packages: write # push Docker images to GHCR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login to GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 4. Get short commit SHA
    - name: Get short commit SHA
      id: vars
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

    # 5. Extract version folder from tag
    - name: Extract version folder
      id: version
      run: |
        # Example tag: transmission-5.0.5-130371f
        TAG="${GITHUB_REF##*/}"  # removes refs/tags/
        # Remove "transmission-" prefix and optional "-<sha>" suffix
        FOLDER=$(echo "$TAG" | sed 's/^transmission-//' | sed 's/-[a-f0-9]\+$//')
        echo "version=$TAG" >> $GITHUB_OUTPUT
        echo "folder=$FOLDER" >> $GITHUB_OUTPUT
        echo "Version folder to build: $FOLDER"

    # 6. Build Docker images
    - name: Build Docker images
      id: build
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        FOLDER="${{ steps.version.outputs.folder }}"
        SHA="${{ steps.vars.outputs.sha }}"

        RELEASE_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-release-${SHA}"
        LATEST_TAG="ghcr.io/${{ github.repository }}/transmission:${VERSION}-latest"

        echo "Building Docker images from folder ./$FOLDER"
        echo "Release tag: $RELEASE_TAG"
        echo "Latest tag: $LATEST_TAG"

        docker build \
          --label "git-commit=${SHA}" \
          -t "$RELEASE_TAG" \
          -t "$LATEST_TAG" \
          ./$FOLDER

        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
